name: Security

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0

  container-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check whether the production image needs scanning
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -Eeuo pipefail

          if [[ "$GITHUB_EVENT_NAME" == "schedule" || -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then
            echo "scan=true" >> "$GITHUB_OUTPUT"
          elif git diff --quiet "$BASE_SHA" "$GITHUB_SHA" -- \
            Dockerfile.prod \
            .dockerignore \
            docker-compose.yml \
            docker-compose.prod.yml \
            pyproject.toml \
            uv.lock \
            .github/workflows/security.yml; then
            echo "scan=false" >> "$GITHUB_OUTPUT"
            echo "No changes to the production image or its security scan."
          else
            echo "scan=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate Compose configuration
        if: steps.changes.outputs.scan == 'true'
        run: |
          touch .env
          docker compose -f docker-compose.yml config --quiet
          docker compose -f docker-compose.prod.yml config --quiet

      - name: Build production image
        if: steps.changes.outputs.scan == 'true'
        run: docker build --file Dockerfile.prod --tag pulsar:security-scan .

      - name: Verify patched packages in production image
        if: steps.changes.outputs.scan == 'true'
        run: |
          docker run --rm --entrypoint /bin/sh pulsar:security-scan -c '
            /usr/local/bin/python -c "import urllib3; assert tuple(map(int, urllib3.__version__.split(\".\"))) >= (2, 8, 0)" &&
            dpkg --compare-versions "$(dpkg-query -W -f="\${Version}" libpcre2-8-0)" ge "10.46-1~deb13u3"
          '

      - name: Scan production image
        if: steps.changes.outputs.scan == 'true'
        id: trivy
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.75.0
          image-ref: pulsar:security-scan
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: Report container vulnerabilities
        if: steps.changes.outputs.scan == 'true' && steps.trivy.outcome == 'failure'
        run: |
          echo '::warning title=Container vulnerabilities::Trivy found HIGH or CRITICAL vulnerabilities. Review the Scan production image step.'
          echo '### Container vulnerabilities found' >> "$GITHUB_STEP_SUMMARY"
          echo 'Trivy reported HIGH or CRITICAL findings. Review the **Scan production image** step for affected packages and fixed versions.' >> "$GITHUB_STEP_SUMMARY"
