name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: "pyproject.toml"

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Run linting (Ruff)
        run: uv run ruff check .

      - name: Run formatting check (Ruff)
        run: uv run ruff format --check .

      - name: Run type checking (ty)
        run: uv run ty check

      - name: Run security audit (pip-audit)
        run: uv run pip-audit

      - name: Run tests
        run: uv run pytest tests/unit tests/integration
        env:
          PYTHONPATH: .
          DATABASE_URL: "sqlite:///./test.db"
          SECRET_KEY: "test-secret-key"
          MANTICORE_URL: "http://localhost:9308"
          APP_ACCESS_TOKEN: "master-token-must-be-very-long-and-secure-32-chars"
          APP_RESULTS_LIMIT: "50"
          EXCLUDE_KEYWORDS: "ГАЛЕРЕЯ,Gallery"
          SESSION_SECRET_KEY: "session-secret-must-be-very-long-and-secure-32-chars"

