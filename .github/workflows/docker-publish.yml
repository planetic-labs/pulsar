name: Docker Build and Publish

on:
  release:
    types: [published]
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - "scripts/check_release_versions.py"
      - "pyproject.toml"
      - "uv.lock"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  dependency-preflight:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install locked dependencies
        run: uv sync --locked --all-groups

      - name: Block vulnerable Python dependencies
        run: uv run --locked pip-audit

      - name: Report outdated Python packages, Actions, and Trivy
        id: version_report
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: uv run --locked python scripts/check_release_versions.py

      - name: Warn if the version report could not run
        if: steps.version_report.outcome == 'failure'
        run: |
          echo '::warning title=Version report unavailable::Could not check the latest releases; review the previous step.'
          echo '### Release dependency freshness' >> "$GITHUB_STEP_SUMMARY"
          echo 'The latest-version check could not run. Review the workflow log.' >> "$GITHUB_STEP_SUMMARY"

      - name: Verify release Buildx setup on PRs
        if: github.event_name == 'pull_request'
        run: |
          docker buildx create --driver docker-container --use
          docker buildx inspect --bootstrap

  build-and-push:
    if: github.event_name == 'release'
    needs: dependency-preflight
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        run: |
          docker buildx create --driver docker-container --use
          docker buildx inspect --bootstrap

      - name: Log in to the Container registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=match,pattern=v(.*),group=1

      - name: Build and push Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile.prod
          push: true
          platforms: linux/amd64
          provenance: true
          sbom: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
