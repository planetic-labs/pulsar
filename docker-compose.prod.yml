name: pulsar-prod

services:
  manticore:
    image: manticoresearch/manticore:latest
    restart: always
    stop_grace_period: 30s
    networks:
      - default
    volumes:
      - manticore_data:/var/lib/manticore
    healthcheck:
      test: ["CMD", "mysql", "-h", "127.0.0.1", "-P", "9306", "-e", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  pulsar:
    image: ghcr.io/planetic-labs/pulsar:latest
    user: "${UID:-1000}:${GID:-1000}"
    restart: always
    stop_grace_period: 30s
    ports:
      - "127.0.0.1:8350:8350"
    networks:
      - default
      - planetic-net
    environment:
      - APP_PORT=8350
    env_file: .env
    depends_on:
      manticore:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8350/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
    volumes:
      # Только данные, код уже внутри контейнера
      - ./data:/app/data
      - ./storage:/app/storage
      - ./config:/app/config
      - ./logs:/app/logs


volumes:
  manticore_data:
    name: pulsar-prod-manticore-data
    external: true

networks:
  default:
  planetic-net:
    external: true

