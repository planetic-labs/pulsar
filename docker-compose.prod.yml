services:
  qdrant:
    image: qdrant/qdrant:latest
    restart: always
    # Ограничиваем доступ к Qdrant извне, если не нужно
    # ports:
    #   - "127.0.0.1:6333:6333"
    networks:
      - homelab-net
    volumes:
      - qdrant_data:/qdrant/storage

  pulsar:
    image: ghcr.io/planetic-labs/pulsar:latest
    user: "${UID:-1000}:${GID:-1000}"
    restart: always
    ports:
      - "127.0.0.1:8000:8000"
    networks:
      - homelab-net
    environment:
      - HF_HOME=/app/models_cache
    env_file: .env
    depends_on:
      qdrant:
        condition: service_started
    volumes:
      # Только данные, код уже внутри контейнера
      - ./downloads:/app/downloads
      - ./data:/app/data
      - ./storage:/app/storage
      - ./models_cache:/app/models_cache
      - ./config:/app/config
      - ./logs:/app/logs


volumes:
  qdrant_data:

networks:
  homelab-net:
    external: true
