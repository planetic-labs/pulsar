services:
  manticore:
    image: manticoresearch/manticore:latest
    restart: always
    ports:
      - "127.0.0.1:9308:9308"
    networks:
      - homelab-net
    volumes:
      - manticore_data:/var/lib/manticore

  pulsar:
    image: ghcr.io/planetic-labs/pulsar:latest
    user: "${UID:-1000}:${GID:-1000}"
    restart: always
    ports:
      - "127.0.0.1:8000:8000"
    networks:
      - homelab-net
    environment:
      - HF_HOME=/app/models_cache
    env_file: .env
    depends_on:
      manticore:
        condition: service_started
    volumes:
      # Только данные, код уже внутри контейнера
      - ./data:/app/data
      - ./storage:/app/storage
      - ./models_cache:/app/models_cache
      - ./config:/app/config
      - ./logs:/app/logs


volumes:
  manticore_data:

networks:
  homelab-net:
    external: true
