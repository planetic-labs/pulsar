services:
  manticore:
    image: manticoresearch/manticore:latest
    restart: always
    ports:
      - "127.0.0.1:9308:9308"
    networks:
      - homelab-net
    volumes:
      - manticore_data:/var/lib/manticore
    healthcheck:
      test: ["CMD", "mysql", "-h", "127.0.0.1", "-P", "9306", "-e", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  pulsar:
    image: ghcr.io/planetic-labs/pulsar:latest
    user: "${UID:-1000}:${GID:-1000}"
    restart: always
    ports:
      - "127.0.0.1:8350:8350"
    networks:
      - homelab-net
    environment:
      - HF_HOME=/app/models_cache
      - APP_PORT=8350
    env_file: .env
    depends_on:
      manticore:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8350/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    volumes:
      # Только данные, код уже внутри контейнера
      - ./data:/app/data
      - ./storage:/app/storage
      - ./models_cache:/app/models_cache
      - ./config:/app/config
      - ./logs:/app/logs


volumes:
  manticore_data:

networks:
  homelab-net:
    external: true
