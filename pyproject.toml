[project]
name = "Pulsar"
version = "2026.05.16"
description = "Enterprise RAG for indexing Google Drive videos and searching transcripts"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.136.3",
    "jinja2>=3.1.6",
    "numpy>=2.4.6",
    "python-dotenv>=1.0.1",
    "uvicorn>=0.49.0",
    "python-multipart>=0.0.32",
    "itsdangerous>=2.2.0",
    "websockets>=16.0",
    "qdrant-client>=1.18.0",
    "pymorphy3>=2.0.2",
    "pymorphy3-dicts-ru",
    "httpx>=0.28.1",
    "imageio-ffmpeg>=0.5.1",
    "pydantic>=2.13.4",
    "fastembed>=0.5.1",
    "google-auth>=2.52.0",
    "urllib3>=2.7.0",
    "pyjwt[crypto]>=2.8.0",
    "boto3>=1.43.28"
]

[dependency-groups]
dev = [
    "pre-commit>=4.6.0",
    "ruff>=0.15.17",
    "ty>=0.0.49",
    "pytest>=8.0.0",
    "pytest-asyncio>=1.4.0",
    "pytest-mock>=3.15.1",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "B", "C4", "UP"]
ignore = [
    "B008", # Allow function calls in argument defaults (FastAPI)
]

[tool.ruff.lint.per-file-ignores]
# These files MUST modify sys.path before imports to work correctly as standalone scripts
"scripts/*" = ["E402"]
"tests/*" = ["E402"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ty]

[tool.ty.environment]
python-version = "3.12"

[tool.ty.analysis]
# These subprojects have their own isolated environments and dependencies
allowed-unresolved-imports = [
    "FlagEmbedding",
    "torch",
    "torch.nn.functional",
    "speechbrain.inference.speaker",
    "soundfile"
]