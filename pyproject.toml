[project]
name = "Pulsar"
version = "2026.06.25"
description = "Enterprise RAG for indexing Google Drive videos and searching transcripts"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.137.2",
    "jinja2>=3.1.6",
    "python-dotenv>=1.0.1",
    "uvicorn>=0.49.0",
    "python-multipart>=0.0.32",
    "pymorphy3>=2.0.2",
    "pymorphy3-dicts-ru",
    "httpx>=0.28.1",
    "pydantic>=2.13.4",
    "google-auth>=2.55.0",
    "requests>=2.34.2",
    "itsdangerous>=2.2.0",
    "pyjwt[crypto]>=2.8.0",
    "pydantic-settings>=2.14.2",
    "aiosqlite>=0.22.1",
    "slowapi>=0.1.10",
]

[dependency-groups]
dev = [
    "pre-commit>=4.6.0",
    "ruff>=0.15.18",
    "ty>=0.0.51",
    "pytest>=9.1.0",
    "pytest-asyncio>=1.4.0",
    "pytest-mock>=3.15.1",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "B", "C4", "UP", "ANN"]
ignore = [
    "B008", # Allow function calls in argument defaults (FastAPI)
    "ANN401", # Dynamically typed expressions (typing.Any) are allowed
    "ANN002", # Missing type annotation for *args
    "ANN003", # Missing type annotation for **kwargs
]

[tool.ruff.lint.per-file-ignores]
# These files MUST modify sys.path before imports to work correctly as standalone scripts
"scripts/*" = ["E402", "ANN"]
"tests/*" = ["E402", "ANN"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ty]

[tool.ty.environment]
python-version = "3.12"

[tool.ty.analysis]
# These subprojects have their own isolated environments and dependencies
allowed-unresolved-imports = [
    "FlagEmbedding",
    "torch",
    "torch.nn.functional",
    "speechbrain.inference.speaker",
    "soundfile"
]

[tool.ty.rules]
unused-awaitable = "error"
unused-ignore-comment = "error"
unused-type-ignore-comment = "error"
useless-overload-body = "error"
