[project]
name = "search-ui"
version = "0.1.0"
description = "Enterprise RAG for indexing Google Drive videos and searching transcripts"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.135.3",
    "imageio-ffmpeg>=0.6.0",
    "jinja2>=3.1.6",
    "numpy>=2.4.4",
    "sentence-transformers>=3.0.0",
    "python-dotenv>=1.0.1",
    "uvicorn>=0.43.0",
    "python-multipart>=0.0.9",
    "itsdangerous>=2.2.0",
    "streamlit>=1.32.0",
    "websockets>=14.2",
    "torch>=2.2.0; sys_platform != 'darwin'",
 # Will be pulled from CPU index
    "qdrant-client[fastembed]>=1.13.2",
    "fastembed>=0.5.1",
    "pymorphy3>=2.0.2",
    "pymorphy3-dicts-ru",
    "speechbrain>=1.0.0",
    "torchaudio",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchaudio = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }
