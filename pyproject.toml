[project]
name = "search-ui"
version = "0.1.0"
description = "Enterprise RAG for indexing Google Drive videos and searching transcripts"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.135.3",
    "imageio-ffmpeg>=0.6.0",
    "jinja2>=3.1.6",
    "numpy>=2.4.4",
    "python-dotenv>=1.0.1",
    "uvicorn>=0.43.0",
    "python-multipart>=0.0.9",
    "itsdangerous>=2.2.0",
    "streamlit>=1.32.0",
    "websockets>=14.2",
    "qdrant-client[fastembed]>=1.13.2",
    "fastembed>=0.5.1",
    "pymorphy3>=2.0.2",
    "pymorphy3-dicts-ru",
    "httpx>=0.27.0",
]

[tool.uv]
package = false
