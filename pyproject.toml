[project]
name = "Pulsar"
version = "2026.07.12"
description = "Enterprise RAG for indexing Google Drive videos and searching transcripts"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Pulsar Contributors" }
]
keywords = ["rag", "fastapi", "manticore", "deepgram", "embeddings", "video-search"]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.141.1",
    "jinja2>=3.1.6",
    "python-dotenv>=1.2.3",
    "uvicorn>=0.52.4",
    "python-multipart>=0.0.32",
    "pymorphy3>=2.0.2",
    "pymorphy3-dicts-ru",
    "httpx>=0.28.1",
    "pydantic>=2.13.4",
    "google-auth>=2.56.3",
    "requests>=2.34.2",
    "itsdangerous>=2.2.0",
    "pyjwt[crypto]>=2.8.0",
    "pydantic-settings>=2.15.0",
    "aiosqlite>=0.22.1",
    "slowapi>=0.1.10",
]

[project.urls]
Homepage = "https://github.com/planetic-labs/pulsar"
Repository = "https://github.com/planetic-labs/pulsar.git"
Issues = "https://github.com/planetic-labs/pulsar/issues"

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "ruff>=0.16.4",
    "ty>=0.0.74",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-mock>=3.15.1",
    "pip-audit>=2.10.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "strict"
filterwarnings = [
    "ignore::DeprecationWarning:slowapi.*",
]

[tool.coverage.run]
source = ["app"]
omit = [
    "tests/*",
    "scripts/*",
    "cron/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = [
    "E", "F", "I", "N", "W", "B", "C4", "UP", "ANN",
    "ASYNC", # flake8-async: best practices for asyncio
    "RUF",   # Ruff-specific rules
    "SIM",   # flake8-simplify: cleaner syntax
]
ignore = [
    "B008", # Allow function calls in argument defaults (FastAPI)
    "ANN401", # Dynamically typed expressions (typing.Any) are allowed
    "ANN002", # Missing type annotation for *args
    "ANN003", # Missing type annotation for **kwargs
    "RUF001", # Allow cyrillic characters in strings
    "RUF002", # Allow cyrillic characters in docstrings
    "RUF003", # Allow cyrillic characters in comments
    "ASYNC230", # Allow standard blocking file I/O in async functions
    "ASYNC240", # Allow Path methods in async routines
]

[tool.ruff.lint.per-file-ignores]
# These files MUST modify sys.path before imports to work correctly as standalone scripts
"scripts/*" = ["E402", "ANN"]
"tests/*" = ["E402", "ANN"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ty]

[tool.ty.environment]
python-version = "3.14"

[tool.ty.analysis]
# These subprojects have their own isolated environments and dependencies
allowed-unresolved-imports = [
    "FlagEmbedding",
    "torch",
    "torch.nn.functional",
    "speechbrain.inference.speaker",
    "soundfile"
]

[tool.ty.rules]
unused-awaitable = "error"
unused-ignore-comment = "error"
unused-type-ignore-comment = "error"
useless-overload-body = "error"
