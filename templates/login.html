<!DOCTYPE html>
<html lang="ru" class="h-full bg-[#FAF9F6]">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход — Pulsar AI</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="theme-color" content="#FAF9F6">
    <link rel="manifest" href="/manifest.json">
    <link rel="apple-touch-icon" href="/static/icon.svg">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Plus Jakarta Sans', 'sans-serif'] },
                    colors: {
                        warm: {
                            50: '#FAF9F6', 100: '#F2F0EB', 200: '#E5E1D8', 300: '#D6D0C2',
                            400: '#BDB4A3', 500: '#9E9282', 600: '#7F7362',
                        },
                        brand: {
                            50: '#F4F5F7', 100: '#E9EAEF', 200: '#D3D5DF', 300: '#A7ABBF',
                            400: '#7B819F', 500: '#5F6683', 600: '#4A5168', 700: '#3A4053',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #FAF9F6; color: #4A453E; }
    </style>
</head>
<body class="h-full flex items-center justify-center p-4 lg:p-6 text-[#4A453E] antialiased bg-[#FAF9F6]">
    <div class="w-full max-w-[440px] relative">
        <div class="bg-white border border-[#E5E1D8] rounded-[2rem] lg:rounded-[3rem] p-8 lg:p-12 shadow-sm">
            <!-- Header -->
            <div class="flex flex-col items-center text-center mb-8">
                <div class="w-14 h-14 lg:w-16 lg:h-16 bg-brand-500 rounded-2xl flex items-center justify-center mb-4 shadow-md opacity-85">
                    <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v7.764a1 1 0 01-1.447.894L15 15M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"></path>
                    </svg>
                </div>
                <h1 class="text-2xl lg:text-3xl font-extrabold text-[#3A3630] tracking-tight">Pulsar AI</h1>
                <p class="text-warm-500 text-xs lg:text-sm mt-1.5 leading-relaxed px-4 italic">Панель управления поиском и индексацией</p>
            </div>

            <!-- Error alert -->
            {% if error %}
            <div id="backend-error" class="p-4 mb-6 rounded-2xl bg-rose-50 border border-rose-200 text-rose-600 text-xs font-semibold text-center flex items-center justify-center gap-2">
                <svg class="w-4 h-4 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
                <span>{{ error }}</span>
            </div>
            {% endif %}

            <!-- Tabs -->
            <div class="flex p-1 bg-warm-100 rounded-xl mb-8 border border-warm-200">
                <button type="button" id="tab-ark" onclick="switchTab('ark')"
                        class="flex-1 py-2 text-xs lg:text-sm font-bold rounded-lg transition-all text-white bg-brand-500 shadow-sm">
                    Ark Messenger
                </button>
                <button type="button" id="tab-fallback" onclick="switchTab('fallback')"
                        class="flex-1 py-2 text-xs lg:text-sm font-bold rounded-lg transition-all text-warm-500 hover:text-warm-700">
                    Резервный ключ
                </button>
            </div>

            <!-- Ark Messenger Form (Two-Step passwordless login) -->
            <form id="form-ark" action="/login" method="post" class="space-y-6">
                <!-- Error alert for ajax -->
                <div id="ark-error" class="hidden p-4 rounded-2xl bg-rose-50 border border-rose-200 text-rose-600 text-xs font-semibold text-center flex items-center justify-center gap-2">
                    <svg class="w-4 h-4 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
                    <span id="ark-error-text"></span>
                </div>

                <!-- Step 1: Email Input -->
                <div class="space-y-2">
                    <label class="block text-xs font-bold text-warm-500 uppercase tracking-wider">Email (Логин в Ark)</label>
                    <input type="email" id="ark-email" name="email" value="{{ email or '' }}" placeholder="username@domain.com" required
                           class="w-full bg-[#FAF9F6] border border-[#E5E1D8] rounded-2xl py-3.5 px-5 text-[#3A3630] placeholder-warm-300 focus:outline-none focus:border-brand-400 focus:ring-1 focus:ring-brand-400 transition-all font-sans text-sm">
                </div>

                <!-- Step 2: Code Input (hidden initially) -->
                <div id="ark-code-container" class="space-y-2 hidden">
                    <div class="flex justify-between items-center">
                        <label class="block text-xs font-bold text-warm-500 uppercase tracking-wider">Пинкод (6 цифр)</label>
                        <a href="javascript:void(0)" onclick="resetArkFlow()" class="text-[10px] text-brand-500 hover:text-brand-600 font-bold uppercase tracking-wider">Изменить Email</a>
                    </div>
                    <input type="text" id="ark-code" name="code" value="{{ code or '' }}" placeholder="000000" pattern="\d{6}" maxlength="6"
                           class="w-full bg-[#FAF9F6] border border-[#E5E1D8] rounded-2xl py-3.5 px-5 text-[#3A3630] placeholder-warm-300 focus:outline-none focus:border-brand-400 focus:ring-1 focus:ring-brand-400 transition-all text-center tracking-[0.4em] font-mono text-lg">
                    <p class="text-[10px] text-warm-400">На ваш email отправлен временный 6-значный код подтверждения.</p>
                </div>

                <!-- Actions -->
                <div class="space-y-3">
                    <!-- Button for step 1 -->
                    <button type="button" id="btn-ark-identify" onclick="runArkIdentify()"
                            class="w-full bg-brand-500 hover:bg-brand-600 text-white font-bold py-3.5 rounded-2xl shadow-md shadow-brand-500/10 transition-all active:scale-[0.98] flex items-center justify-center gap-3 text-sm lg:text-base">
                        <span id="btn-ark-identify-text">Получить пинкод</span>
                        <svg id="btn-ark-identify-spinner" class="animate-spin h-4 w-4 hidden" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                        </svg>
                    </button>

                    <!-- Button for step 2 (hidden initially) -->
                    <button type="submit" id="btn-ark-verify" class="w-full bg-brand-500 hover:bg-brand-600 text-white font-bold py-3.5 rounded-2xl shadow-md shadow-brand-500/10 transition-all active:scale-[0.98] flex items-center justify-center gap-3 text-sm lg:text-base hidden">
                        <span>Войти</span>
                        <svg class="w-4 h-4 opacity-75" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M13 7l5 5m0 0l-5 5m5-5H6"></path></svg>
                    </button>
                </div>
            </form>

            <!-- Fallback Static Token Form -->
            <form id="form-fallback" action="/login" method="post" class="space-y-6 hidden">
                <div class="space-y-2">
                    <label class="block text-xs font-bold text-warm-500 uppercase tracking-wider">Ключ доступа (Пароль)</label>
                    <input type="password" name="token" placeholder="Ваш Ключ Доступа..." required
                           class="w-full bg-[#FAF9F6] border border-[#E5E1D8] rounded-2xl py-3.5 px-5 text-[#3A3630] placeholder-warm-300 focus:outline-none focus:border-brand-500 focus:ring-1 focus:ring-brand-500 transition-all text-center tracking-[0.2em] font-mono text-sm">
                    <p class="text-[10px] text-warm-400">Резервный статический токен авторизации, заданный в настройках .env.</p>
                </div>
                
                <button type="submit" class="w-full bg-brand-500 hover:bg-brand-600 text-white font-bold py-3.5 rounded-2xl shadow-md shadow-brand-500/10 transition-all active:scale-[0.98] flex items-center justify-center gap-3 text-sm lg:text-base">
                    <span>Войти по ключу</span>
                    <svg class="w-4 h-4 opacity-75" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M13 7l5 5m0 0l-5 5m5-5H6"></path></svg>
                </button>
            </form>
        </div>
        
        <p class="text-center mt-8 text-[9px] uppercase tracking-[0.5em] text-warm-400 font-bold">
            Secured Analytical Node
        </p>
    </div>

    <script>
        // Check if backend returned prefilled values from a failed verification attempt
        const prefilledEmail = "{{ email or '' }}";
        const prefilledCode = "{{ code or '' }}";

        window.addEventListener('DOMContentLoaded', () => {
            // Initially disable fallback key input so it doesn't block HTML5 validation of Ark form
            document.getElementById('form-fallback').querySelector('input').disabled = true;

            if (prefilledEmail) {
                // Restore Step 2 state if prefilled by backend
                const emailInput = document.getElementById('ark-email');
                emailInput.readOnly = true;
                emailInput.disabled = false;
                
                document.getElementById('ark-code-container').classList.remove('hidden');
                const codeInput = document.getElementById('ark-code');
                codeInput.required = true;
                codeInput.disabled = false;
                
                document.getElementById('btn-ark-identify').classList.add('hidden');
                document.getElementById('btn-ark-verify').classList.remove('hidden');
            } else {
                // Ensure code input is disabled so it doesn't block Step 1 submit validation
                document.getElementById('ark-code').disabled = true;
            }
        });

        async function runArkIdentify() {
            const emailInput = document.getElementById('ark-email');
            const errorDiv = document.getElementById('ark-error');
            const errorText = document.getElementById('ark-error-text');
            const backendErrorDiv = document.getElementById('backend-error');
            const btnText = document.getElementById('btn-ark-identify-text');
            const spinner = document.getElementById('btn-ark-identify-spinner');
            
            const email = emailInput.value.trim();
            if (!email) {
                emailInput.reportValidity();
                return;
            }
            
            // Hide previous errors
            errorDiv.classList.add('hidden');
            if (backendErrorDiv) backendErrorDiv.classList.add('hidden');
            
            // Loading state
            btnText.textContent = "Отправка...";
            spinner.classList.remove('hidden');
            emailInput.disabled = true;
            
            try {
                const response = await fetch('/api/v1/auth/identify', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: email })
                });
                
                const data = await response.json();
                
                if (response.ok && data.next === 'enter_code') {
                    // Transition to step 2
                    emailInput.readOnly = true;
                    emailInput.disabled = false; // keep enabled for form submission
                    
                    const codeContainer = document.getElementById('ark-code-container');
                    const codeInput = document.getElementById('ark-code');
                    codeContainer.classList.remove('hidden');
                    codeInput.required = true;
                    codeInput.disabled = false;
                    
                    document.getElementById('btn-ark-identify').classList.add('hidden');
                    document.getElementById('btn-ark-verify').classList.remove('hidden');
                    codeInput.focus();
                } else {
                    // Handle identify error
                    let msg = "Пользователь не найден или заблокирован.";
                    if (data.error && data.error !== 'not_found') {
                        msg = `Ошибка: ${data.error}`;
                    }
                    errorText.textContent = msg;
                    errorDiv.classList.remove('hidden');
                    emailInput.disabled = false;
                    btnText.textContent = "Получить пинкод";
                    spinner.classList.add('hidden');
                }
            } catch (err) {
                console.error(err);
                errorText.textContent = "Не удалось связаться с сервером авторизации.";
                errorDiv.classList.remove('hidden');
                emailInput.disabled = false;
                btnText.textContent = "Получить пинкод";
                spinner.classList.add('hidden');
            }
        }
        
        function resetArkFlow() {
            const emailInput = document.getElementById('ark-email');
            emailInput.readOnly = false;
            emailInput.disabled = false;
            emailInput.value = "";
            
            const codeInput = document.getElementById('ark-code');
            document.getElementById('ark-code-container').classList.add('hidden');
            codeInput.required = false;
            codeInput.disabled = true;
            codeInput.value = "";
            
            document.getElementById('btn-ark-identify').classList.remove('hidden');
            document.getElementById('btn-ark-verify').classList.add('hidden');
            
            const btnText = document.getElementById('btn-ark-identify-text');
            const spinner = document.getElementById('btn-ark-identify-spinner');
            btnText.textContent = "Получить пинкод";
            spinner.classList.add('hidden');
            
            document.getElementById('ark-error').classList.add('hidden');
            const backendErrorDiv = document.getElementById('backend-error');
            if (backendErrorDiv) backendErrorDiv.classList.add('hidden');
            
            emailInput.focus();
        }

        function switchTab(type) {
            const tabArk = document.getElementById('tab-ark');
            const tabFallback = document.getElementById('tab-fallback');
            const formArk = document.getElementById('form-ark');
            const formFallback = document.getElementById('form-fallback');

            if (type === 'ark') {
                tabArk.className = "flex-1 py-2 text-xs lg:text-sm font-bold rounded-lg transition-all text-white bg-brand-500 shadow-sm";
                tabFallback.className = "flex-1 py-2 text-xs lg:text-sm font-bold rounded-lg transition-all text-warm-500 hover:text-warm-700";
                formArk.classList.remove('hidden');
                formFallback.classList.add('hidden');
                
                // Enable/disable inputs so validation matches active tab
                document.getElementById('form-fallback').querySelector('input').disabled = true;
                document.getElementById('ark-email').disabled = false;
                
                if (document.getElementById('ark-code-container').classList.contains('hidden')) {
                    document.getElementById('ark-code').disabled = true;
                } else {
                    document.getElementById('ark-code').disabled = false;
                }
            } else {
                tabFallback.className = "flex-1 py-2 text-xs lg:text-sm font-bold rounded-lg transition-all text-white bg-brand-500 shadow-sm";
                tabArk.className = "flex-1 py-2 text-xs lg:text-sm font-bold rounded-lg transition-all text-warm-500 hover:text-warm-700";
                formFallback.classList.remove('hidden');
                formArk.classList.add('hidden');
                
                document.getElementById('form-fallback').querySelector('input').disabled = false;
                document.getElementById('ark-email').disabled = true;
                document.getElementById('ark-code').disabled = true;
            }
        }

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js');
            });
        }
    </script>
</body>
</html>
