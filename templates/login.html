<!DOCTYPE html>
<html lang="ru" class="h-full bg-[#FAF9F6]">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход — Pulsar AI</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="theme-color" content="#FAF9F6">
    <link rel="manifest" href="/manifest.json">
    <link rel="apple-touch-icon" href="/static/icon.svg">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Plus Jakarta Sans', sans-serif; }</style>
</head>
<body class="h-full flex items-center justify-center p-4 lg:p-6 text-[#4A453E] antialiased bg-[#FAF9F6]">
    <div class="w-full max-w-[440px] relative">
        <div class="bg-white border border-[#E5E1D8] rounded-[2rem] lg:rounded-[3rem] p-8 lg:p-12 shadow-sm">
            <div class="flex flex-col items-center text-center mb-8 lg:mb-12">
                <div class="w-14 h-14 lg:w-16 lg:h-16 bg-brand-500 rounded-[1.5rem] lg:rounded-[2rem] flex items-center justify-center mb-6 lg:mb-8 shadow-md opacity-80">
                    <svg class="w-8 h-8 lg:w-10 lg:h-10 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v7.764a1 1 0 01-1.447.894L15 15M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>
                </div>
                <h1 class="text-2xl lg:text-3xl font-bold text-[#3A3630] tracking-tight mb-2 lg:mb-3">Pulsar AI</h1>
                <p class="text-warm-400 text-xs lg:text-sm leading-relaxed px-4 italic">Авторизация в системе</p>
            </div>

            <form action="/login" method="post" class="space-y-6 lg:space-y-8">
                {% if error %}
                <div class="p-4 rounded-2xl bg-rose-50 border border-rose-100 text-rose-500 text-xs font-bold text-center">
                    {{ error }}
                </div>
                {% endif %}
                
                <div class="space-y-3">
                    <input type="password" name="token" placeholder="Ваш Ключ Доступа" required autofocus
                           class="w-full bg-[#FAF9F6] border border-[#E5E1D8] rounded-2xl py-3 lg:py-4 px-6 text-[#3A3630] placeholder-warm-200 focus:outline-none focus:border-brand-300 transition-all text-center tracking-[0.2em] lg:tracking-[0.3em] font-mono text-sm lg:text-base">
                </div>
                
                <button type="submit" class="w-full bg-brand-500 hover:bg-brand-600 text-white font-bold py-3 lg:py-4 rounded-2xl shadow-md transition-all active:scale-[0.98] flex items-center justify-center gap-3 text-sm lg:text-base">
                    <span>Войти</span>
                    <svg class="w-4 h-4 lg:w-5 lg:h-5 opacity-50" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M13 7l5 5m0 0l-5 5m5-5H6"></path></svg>
                </button>
            </form>
        </div>
        
        <p class="text-center mt-8 lg:mt-12 text-[8px] lg:text-[9px] uppercase tracking-[0.4em] lg:tracking-[0.5em] text-warm-300 font-black">
            Secured Analytical Node
        </p>
    </div>

    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js');
            });
        }
    </script>
</body>
</html>
