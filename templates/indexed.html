{% extends "base.html" %}

{% block title %}Индекс — Pulsar AI{% endblock %}

{% block content %}
<div class="flex-1 flex flex-col overflow-hidden px-4 lg:px-10 pb-6 lg:pb-10 pt-6 lg:pt-8">
    <!-- Header -->
    <div class="flex items-center justify-between mb-8 shrink-0">
        <div>
            <h1 class="text-2xl lg:text-3xl font-black text-[#3A3630] tracking-tight uppercase">Индекс</h1>
            <p class="text-[10px] font-bold text-warm-400 uppercase tracking-widest mt-1">Управление структурой и базой знаний</p>
        </div>
        <div class="flex items-center gap-3">
            <button onclick="createFolder()" class="h-9 px-4 bg-white border border-[#E5E1D8] hover:bg-warm-50 text-warm-500 rounded-xl text-[10px] font-black uppercase tracking-widest transition-all shadow-sm flex items-center justify-center gap-2 active:scale-95">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M9 13h6m-3-3v6m-9 1V7a2 2 0 012-2h6l2 2h6a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2z"></path></svg>
                Новая папка
            </button>
        </div>
    </div>

    <!-- Toolbar & Breadcrumbs -->
    <div class="bg-white rounded-2xl shadow-sm border border-[#E5E1D8] mb-6 shrink-0 flex items-center px-4 py-3">
        <button id="btn-up" onclick="goUp()" class="hidden mr-4 p-2 text-warm-400 hover:text-brand-600 hover:bg-warm-50 rounded-xl transition-all disabled:opacity-50" title="На уровень вверх">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 10l7-7m0 0l7 7m-7-7v18"></path></svg>
        </button>
        <div class="w-px h-6 bg-[#F2F0EB] mr-4 hidden" id="divider-up"></div>
        <nav class="flex text-[11px] font-bold uppercase tracking-widest overflow-x-auto no-scrollbar" aria-label="Breadcrumb">
            <ol class="inline-flex items-center space-x-1" id="breadcrumbs-list"></ol>
        </nav>
    </div>

    <!-- Main List Area -->
    <div class="flex-1 bg-white border border-[#E5E1D8] rounded-[1.5rem] lg:rounded-[2rem] overflow-hidden relative flex flex-col shadow-sm">
        <div class="flex-1 overflow-y-auto custom-scrollbar" id="scroll-container">
            <table class="w-full text-left border-collapse">
                <thead class="sticky top-0 z-20 shadow-sm">
                    <tr class="bg-[#FAF9F6] border-b border-[#E5E1D8]">
                        <th class="px-6 py-4 text-[10px] font-black text-warm-400 uppercase tracking-widest bg-[#FAF9F6]">Название</th>
                    </tr>
                </thead>
                <tbody class="divide-y divide-[#F2F0EB]" id="file-list">
                    <!-- Dynamically populated -->
                </tbody>
            </table>
            
            <!-- Loading State -->
            <div id="loading-state" class="absolute inset-0 bg-[#FAF9F6]/80 backdrop-blur-sm flex flex-col items-center justify-center z-10">
                <svg class="animate-spin h-10 w-10 text-brand-500 mb-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
                <p class="text-[10px] font-black text-warm-400 uppercase tracking-widest">Загрузка...</p>
            </div>

            <!-- Empty State -->
            <div id="empty-state" class="hidden py-20 flex flex-col items-center justify-center text-warm-400">
                <p class="text-sm font-bold text-[#3A3630] mb-1 uppercase tracking-tight">Папка пуста</p>
                <p class="text-xs uppercase tracking-widest opacity-60">Здесь пока нет проиндексированных файлов</p>
            </div>
        </div>
    </div>
</div>

<script>
let currentFolderId = 'root';
let currentPath = [];
let selectedVideoIds = new Set();
let lastSelectedIndex = -1;
let currentItems = [];
let draggedVideoId = null;

function formatDuration(seconds) {
    if (!seconds) return '—';
    const h = Math.floor(seconds / 3600);
    const m = Math.floor((seconds % 3600) / 60);
    const s = Math.floor(seconds % 60);
    return h > 0 ? `${h}ч ${m}м` : `${m}м ${s}с`;
}

function updateSelectionUI() {
    document.querySelectorAll('#file-list tr').forEach((tr, idx) => {
        const item = currentItems[idx];
        if (item && !item.is_folder && selectedVideoIds.has(item.id)) {
            tr.classList.add('bg-brand-50/60');
        } else {
            tr.classList.remove('bg-brand-50/60');
        }
    });
}

function handleRowClick(e, id, index) {
    if (e.shiftKey && lastSelectedIndex !== -1) {
        const start = Math.min(index, lastSelectedIndex);
        const end = Math.max(index, lastSelectedIndex);
        for (let i = start; i <= end; i++) {
            if (!currentItems[i].is_folder) selectedVideoIds.add(currentItems[i].id);
        }
    } else if (e.ctrlKey || e.metaKey) {
        if (selectedVideoIds.has(id)) selectedVideoIds.delete(id);
        else selectedVideoIds.add(id);
    } else {
        selectedVideoIds.clear();
        selectedVideoIds.add(id);
    }
    lastSelectedIndex = index;
    updateSelectionUI();
}

function renderBreadcrumbs(path) {
    const breadcrumbsList = document.getElementById('breadcrumbs-list');
    const btnUp = document.getElementById('btn-up');
    const dividerUp = document.getElementById('divider-up');
    
    breadcrumbsList.innerHTML = '';
    currentPath = path;

    if (path.length > 0) {
        btnUp.classList.remove('hidden');
        dividerUp.classList.remove('hidden');
        btnUp.ondragover = (e) => { e.preventDefault(); btnUp.classList.add('bg-brand-50'); };
        btnUp.ondragleave = () => btnUp.classList.remove('bg-brand-50');
        btnUp.ondrop = (e) => {
            const parent = currentPath.length > 1 ? currentPath[currentPath.length - 2].id : 'root';
            handleDrop(e, parent);
        };
    } else {
        btnUp.classList.add('hidden');
        dividerUp.classList.add('hidden');
    }

    const rootLi = document.createElement('li');
    rootLi.className = 'inline-flex items-center shrink-0';
    rootLi.innerHTML = `
        <a href="javascript:void(0)" onclick="loadVideos('root')" 
           class="inline-flex items-center text-warm-400 hover:text-brand-600 hover:bg-warm-50 px-3 py-2 rounded-xl transition-all ${path.length === 0 ? 'text-brand-600 bg-warm-50' : ''}"
           ondragover="event.preventDefault(); this.classList.add('bg-brand-50')"
           ondragleave="this.classList.remove('bg-brand-50')"
           ondrop="handleDrop(event, 'root')">
            <svg class="w-4 h-4 mr-2" fill="currentColor" viewBox="0 0 20 20"><path d="M10.707 2.293a1 1 0 00-1.414 0l-7 7a1 1 0 001.414 1.414L4 10.414V17a1 1 0 001 1h2a1 1 0 001-1v-2a1 1 0 011-1h2a1 1 0 011 1v2a1 1 0 001 1h2a1 1 0 001-1v-6.586l.293.293a1 1 0 001.414-1.414l-7-7z"></path></svg>
            Архив
        </a>
    `;
    breadcrumbsList.appendChild(rootLi);

    path.forEach((crumb, index) => {
        const isLast = index === path.length - 1;
        const li = document.createElement('li');
        li.className = 'flex items-center shrink-0';
        li.innerHTML = `
            <svg class="w-4 h-4 text-warm-200 mx-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M9 5l7 7-7 7"></path></svg>
            <a href="javascript:void(0)" onclick="loadVideos('${crumb.id}')" 
               class="px-3 py-2 rounded-xl transition-all truncate max-w-[150px] sm:max-w-[200px] block ${isLast ? 'text-brand-600 bg-warm-50 pointer-events-none' : 'text-warm-400 hover:text-brand-600 hover:bg-warm-50'}"
               ondragover="event.preventDefault(); this.classList.add('bg-brand-50')"
               ondragleave="this.classList.remove('bg-brand-50')"
               ondrop="handleDrop(event, '${crumb.id}')">${crumb.name}</a>
        `;
        breadcrumbsList.appendChild(li);
    });
}

function goUp() {
    if (currentPath.length > 1) {
        loadVideos(currentPath[currentPath.length - 2].id);
    } else if (currentPath.length === 1) {
        loadVideos('root');
    }
}

async function createFolder() {
    const name = prompt('Введите название папки:');
    if (!name) return;
    
    const formData = new FormData();
    formData.append('name', name);
    if (currentFolderId !== 'root') {
        formData.append('parent_id', currentFolderId);
    }
    
    try {
        const res = await fetch('/api/v1/indexed/mkdir', { method: 'POST', body: formData });
        if (res.ok) loadVideos(currentFolderId);
    } catch (e) { alert('Ошибка при создании папки'); }
}

async function loadVideos(folderId = 'root') {
    currentFolderId = folderId;
    const listBody = document.getElementById('file-list');
    const loading = document.getElementById('loading-state');
    const empty = document.getElementById('empty-state');
    
    loading.classList.remove('hidden');
    empty.classList.add('hidden');
    listBody.style.opacity = '0.4';
    selectedVideoIds.clear();
    lastSelectedIndex = -1;
    
    try {
        const url = folderId === 'root' ? '/api/v1/indexed/ls' : `/api/v1/indexed/ls?folder_id=${folderId}`;
        const response = await fetch(url);
        if (!response.ok) throw new Error('Ошибка сети');
        
        const data = await response.json();
        const { items, path } = data;
        currentItems = items;
        
        listBody.innerHTML = '';
        renderBreadcrumbs(path);
        
        if (items.length === 0) {
            empty.classList.remove('hidden');
        } else {
            items.forEach((item, index) => {
                const tr = document.createElement('tr');
                tr.className = "hover:bg-[#FDFDFB] transition-colors group cursor-pointer select-none";
                
                if (item.is_folder) {
                    tr.classList.add('folder-drop-zone');
                    tr.onclick = () => loadVideos(item.id);
                    tr.ondragover = (e) => { e.preventDefault(); tr.classList.add('bg-brand-50'); };
                    tr.ondragleave = () => tr.classList.remove('bg-brand-50');
                    tr.ondrop = (e) => handleDrop(e, item.id);

                    tr.innerHTML = `
                        <td class="px-6 py-3">
                            <div class="flex items-center gap-3">
                                <svg class="w-5 h-5 text-brand-200 group-hover:text-brand-400 transition-colors shrink-0" fill="currentColor" viewBox="0 0 20 20"><path d="M2 6a2 2 0 012-2h5l2 2h5a2 2 0 012 2v6a2 2 0 01-2 2H4a2 2 0 01-2-2V6z"></path></svg>
                                
                                <!-- Folder Actions -->
                                <div class="flex items-center gap-0.5 shrink-0">
                                    <button onclick="event.stopPropagation(); renameFolder('${item.id}', '${item.name.replace(/'/g, "\\'")}')" 
                                            class="p-1.5 text-warm-300 hover:text-brand-500 hover:bg-brand-50 rounded-lg transition-all" title="Переименовать">
                                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 00-2 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path></svg>
                                    </button>
                                    <button onclick="event.stopPropagation(); deleteFolder('${item.id}', '${item.name.replace(/'/g, "\\'")}')" 
                                            class="p-1.5 text-warm-300 hover:text-rose-500 hover:bg-rose-50 rounded-lg transition-all" title="Удалить">
                                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                                    </button>
                                </div>

                                <span class="text-xs font-bold text-[#3A3630] uppercase tracking-tight">${item.name}</span>
                            </div>
                        </td>
                    `;
                } else {
                    tr.draggable = true;
                    tr.ondragstart = (e) => {
                        if (!selectedVideoIds.has(item.id)) {
                            selectedVideoIds.clear();
                            selectedVideoIds.add(item.id);
                            updateSelectionUI();
                        }
                        tr.classList.add('opacity-40');
                        e.dataTransfer.setData('text/plain', Array.from(selectedVideoIds).join(','));
                    };
                    tr.ondragend = () => tr.classList.remove('opacity-40');

                    tr.onclick = (e) => {
                        if (e.target.tagName !== 'A' && !e.target.closest('a') && !e.target.closest('button')) {
                            handleRowClick(e, item.id, index);
                        }
                    };
                    const conf = item.confidence ? Math.round(item.confidence * 100) : 0;
                    const confClass = conf > 90 ? 'text-green-600 bg-green-50 border-green-100' : 'text-warm-500 bg-warm-50 border-warm-100';
                    
                    const driveLink = item.source_file_id ? `<a href="https://drive.google.com/file/d/${item.source_file_id}/view" target="_blank" onclick="event.stopPropagation();" class="p-1.5 text-warm-300 hover:text-blue-600 hover:bg-blue-50 rounded-lg transition-all" title="Открыть в Google Drive"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path></svg></a>` : '';

                    tr.innerHTML = `
                        <td class="px-6 py-3">
                            <div class="flex items-center justify-between w-full">
                                <div class="flex items-center gap-3 min-w-0">
                                    
                                    <!-- File Action Icons -->
                                    <div class="flex items-center gap-0.5 shrink-0">
                                        ${driveLink}
                                        <a href="/?q=v:${item.id}" class="p-1.5 text-warm-300 hover:text-brand-500 hover:bg-brand-50 rounded-lg transition-all" title="Открыть в поиске">
                                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                                        </a>
                                        <button onclick="event.stopPropagation(); toggleShort(${item.id})" 
                                                class="p-1.5 ${item.is_short ? 'text-teal-500 hover:text-teal-600 bg-teal-50/50' : 'text-warm-300 hover:text-teal-500'} rounded-lg transition-all" 
                                                title="${item.is_short ? 'Убрать статус короткого видео' : 'Сделать коротким видео (без чанков)'}">
                                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 4v16M17 4v16M3 8h4m10 0h4M3 12h18M3 16h4m10 0h4"></path></svg>
                                        </button>
                                        <button class="p-1.5 text-warm-200 cursor-not-allowed opacity-50" title="Переиндексировать (в разработке)">
                                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
                                        </button>
                                    </div>

                                    <div class="flex items-center gap-2 min-w-0">
                                        <span class="text-xs font-bold text-[#3A3630] truncate uppercase tracking-tight">${item.name}</span>
                                        ${item.is_short ? '<span class="px-1.5 py-0.5 bg-teal-100 text-teal-700 text-[8px] font-black uppercase tracking-widest rounded-md shrink-0">Short</span>' : ''}
                                    </div>
                                </div>
                            </div>
                        </td>
                    `;
                }
                listBody.appendChild(tr);
            });
        }
    } catch (error) {
        console.error(error);
    } finally {
        listBody.style.opacity = '1';
        loading.classList.add('hidden');
    }
}

async function renameFolder(id, oldName) {
    const newName = prompt('Новое название папки:', oldName);
    if (!newName || newName === oldName) return;
    
    const formData = new FormData();
    formData.append('folder_id', id);
    formData.append('new_name', newName);
    
    try {
        const res = await fetch('/api/v1/indexed/folders/rename', { method: 'POST', body: formData });
        if (res.ok) loadVideos(currentFolderId);
    } catch (e) { alert('Ошибка при переименовании'); }
}

async function deleteFolder(id, name) {
    if (!confirm(`Удалить папку «${name}»? Сами видео останутся в архиве.`)) return;
    
    try {
        const res = await fetch(`/api/v1/indexed/folders/${id}`, { method: 'DELETE' });
        if (res.ok) loadVideos(currentFolderId);
    } catch (e) { alert('Ошибка при удалении'); }
}

async function toggleShort(id) {
    try {
        const res = await fetch(`/api/v1/indexed/videos/${id}/toggle_short`, { method: 'POST' });
        if (res.ok) {
            loadVideos(currentFolderId);
        } else {
            alert('Ошибка при смене статуса');
        }
    } catch (e) { console.error(e); }
}

async function handleDrop(e, folderId) {
    e.preventDefault();
    e.currentTarget.classList.remove('bg-brand-50');
    
    const idsString = e.dataTransfer.getData('text/plain');
    if (!idsString) return;
    const ids = idsString.split(',');
    
    for (const id of ids) {
        const formData = new FormData();
        formData.append('video_id', id);
        formData.append('folder_id', folderId);
        
        try {
            await fetch('/api/v1/indexed/move', { method: 'POST', body: formData });
        } catch (e) { console.error(id, e); }
    }
    loadVideos(currentFolderId);
}

document.addEventListener('DOMContentLoaded', () => loadVideos());
</script>
{% endblock %}
