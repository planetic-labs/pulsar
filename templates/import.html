{% extends "base.html" %}

{% block title %}Импорт — VideoDB AI{% endblock %}

{% block content %}
<div class="flex-1 flex flex-col overflow-hidden px-4 lg:px-10 pb-6 lg:pb-10 pt-6 lg:pt-8">
    <div class="flex items-center justify-between mb-8">
        <div>
            <h1 class="text-2xl lg:text-3xl font-black text-[#3A3630] tracking-tight">Google Drive</h1>
            <div id="drive-breadcrumbs" class="flex items-center gap-2 text-[10px] font-bold text-brand-500 uppercase tracking-widest mt-2 overflow-x-auto whitespace-nowrap custom-scrollbar pb-1">
                <!-- Breadcrumbs here -->
            </div>
        </div>
        <div class="flex items-center gap-3 lg:gap-4">
            <!-- Global Diarization Toggle -->
            <label class="flex items-center gap-3 cursor-pointer group bg-white border border-[#E5E1D8] px-4 py-2 rounded-2xl shadow-sm hover:border-brand-300 transition-all">
                <div class="relative">
                    <input type="checkbox" id="global-diarize" class="sr-only peer" checked>
                    <div class="w-10 h-5 bg-warm-200 rounded-full peer peer-checked:bg-brand-500 transition-all after:content-[''] after:absolute after:top-0.5 after:left-0.5 after:bg-white after:border-warm-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:after:translate-x-5"></div>
                </div>
                <span class="hidden sm:inline text-[10px] font-black text-warm-500 uppercase tracking-widest group-hover:text-brand-600 transition-colors">Распознавать голоса</span>
                <span class="sm:hidden text-[10px] font-black text-warm-500 uppercase tracking-widest">AI</span>
            </label>

            <div id="auth-status" class="hidden px-4 py-2 bg-rose-50 border border-rose-100 rounded-2xl text-[10px] font-black text-rose-500 uppercase tracking-widest flex items-center gap-2">
                <div class="w-2 h-2 rounded-full bg-rose-500 animate-pulse"></div> Ошибка Google
            </div>
            <button onclick="loadDriveFolder(currentFolderId, '', true)" class="p-2 bg-white border border-[#E5E1D8] rounded-xl text-warm-500 hover:text-brand-500 transition-all shadow-sm active:scale-95">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.001 0 01-15.357-2m15.357 2H15"></path></svg>
            </button>
        </div>
    </div>

    <!-- Browser Grid -->
    <div class="flex-1 overflow-y-auto custom-scrollbar bg-white border border-[#E5E1D8] rounded-[2rem] shadow-inner overflow-hidden flex flex-col">
        <div id="drive-contents" class="p-4 lg:p-8 grid grid-cols-2 md:grid-cols-3 xl:grid-cols-4 2xl:grid-cols-5 gap-4 lg:gap-6">
            <!-- Files and Folders here -->
        </div>
    </div>

    <!-- Manual ID Footer -->
    <div class="mt-6 flex flex-col sm:flex-row gap-4">
        <div class="flex-1 relative group">
            <input type="text" id="manual-file-id" class="w-full bg-white border border-[#E5E1D8] rounded-2xl px-6 py-4 text-sm focus:outline-none focus:border-brand-500 shadow-sm transition-all group-hover:border-warm-300" placeholder="ID файла или папки вручную...">
            <div class="absolute right-4 top-4 text-warm-200 group-hover:text-brand-300 transition-colors">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4"></path></svg>
            </div>
        </div>
        <button onclick="submitIngestManual()" class="px-10 py-4 bg-brand-500 text-white rounded-2xl font-black text-xs uppercase tracking-[0.2em] hover:bg-brand-600 transition-all shadow-lg shadow-brand-500/20 active:scale-95">
            Индексировать
        </button>
    </div>
</div>

<script>
    let currentFolderId = 'root';
    let breadcrumbs = [{id: 'root', name: 'Мой диск'}];

    async function loadDriveFolder(id, name, isBack = false) {
        currentFolderId = id;
        const container = document.getElementById('drive-contents');
        container.innerHTML = `
            <div class="col-span-full flex flex-col items-center justify-center py-32 space-y-4">
                <div class="relative">
                    <div class="w-12 h-12 border-4 border-brand-100 border-t-brand-500 rounded-full animate-spin"></div>
                    <div class="absolute inset-0 flex items-center justify-center">
                        <div class="w-2 h-2 bg-brand-500 rounded-full"></div>
                    </div>
                </div>
                <span class="animate-pulse text-warm-400 font-black uppercase text-[10px] tracking-[0.3em]">Чтение хранилища...</span>
            </div>
        `;
        
        if (!isBack && id !== 'root') {
            breadcrumbs.push({id, name});
        } else if (isBack) {
            const idx = breadcrumbs.findIndex(b => b.id === id);
            breadcrumbs = breadcrumbs.slice(0, idx + 1);
        }
        renderBreadcrumbs();

        try {
            const res = await fetch(`/api/drive/ls?folder_id=${id}`);
            if (res.status === 401) {
                showAuthError();
                return;
            }
            const items = await res.json();
            document.getElementById('auth-status').classList.add('hidden');
            
            let html = '';
            items.forEach(item => {
                const icon = item.is_folder 
                    ? '<div class="w-12 h-12 bg-blue-50 text-blue-500 rounded-2xl flex items-center justify-center mb-4 group-hover:bg-blue-500 group-hover:text-white transition-all shadow-sm"><svg class="w-6 h-6" fill="currentColor" viewBox="0 0 20 20"><path d="M2 6a2 2 0 012-2h5l2 2h5a2 2 0 012 2v6a2 2 0 01-2 2H4a2 2 0 01-2-2V6z"></path></svg></div>'
                    : '<div class="w-12 h-12 bg-brand-50 text-brand-500 rounded-2xl flex items-center justify-center mb-4 group-hover:bg-brand-500 group-hover:text-white transition-all shadow-sm"><svg class="w-6 h-6" fill="currentColor" viewBox="0 0 20 20"><path d="M4 3a2 2 0 00-2 2v10a2 2 0 002 2h12a2 2 0 002-2V5a2 2 0 00-2-2H4zm0 2h12v10H4V5z"></path></svg></div>';
                
                const action = item.is_folder
                    ? `onclick="loadDriveFolder('${item.id}', '${item.name.replace(/'/g, "\\'")}')"`
                    : `onclick="queueIngest('${item.id}', '${item.name.replace(/'/g, "\\'")}')"`;

                html += `
                    <div ${action} class="p-5 lg:p-6 bg-[#FAF9F6] border border-[#F2F0EB] hover:border-brand-300 hover:bg-white rounded-[2rem] cursor-pointer transition-all group relative overflow-hidden shadow-sm hover:shadow-xl hover:-translate-y-1 flex flex-col h-full">
                        ${icon}
                        <h4 class="text-xs lg:text-sm font-bold text-[#3A3630] line-clamp-2 mb-2 flex-1">${item.name}</h4>
                        <div class="flex items-center justify-between mt-auto">
                            <span class="text-[8px] lg:text-[9px] font-black text-warm-400 uppercase tracking-widest">${item.is_folder ? 'Папка' : 'Видео'}</span>
                            ${!item.is_folder ? `
                                <div class="opacity-0 group-hover:opacity-100 flex items-center gap-1 text-[8px] lg:text-[9px] font-black text-brand-500 uppercase tracking-widest transition-all translate-x-2 group-hover:translate-x-0">
                                    Индекс <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M9 5l7 7-7 7"></path></svg>
                                </div>
                            ` : ''}
                        </div>
                    </div>
                `;
            });
            container.innerHTML = html || `
                <div class="col-span-full flex flex-col items-center justify-center py-32 opacity-40">
                    <svg class="w-12 h-12 mb-4 text-warm-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M5 19a2 2 0 01-2-2V7a2 2 0 012-2h4l2 2h4a2 2 0 012 2v1m-6 9a3 3 0 100-6 3 3 0 000 6zm-7 4a6 6 0 0112 0H4z"></path></svg>
                    <span class="text-sm font-medium text-warm-500 italic">Папка пуста</span>
                </div>
            `;
        } catch (e) {
            container.innerHTML = `
                <div class="col-span-full flex flex-col items-center justify-center py-32 text-rose-500">
                    <svg class="w-12 h-12 mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
                    <span class="font-black uppercase text-[10px] tracking-widest">Ошибка соединения с Google</span>
                </div>
            `;
        }
    }

    function showAuthError() {
        const container = document.getElementById('drive-contents');
        document.getElementById('auth-status').classList.remove('hidden');
        container.innerHTML = `
            <div class="col-span-full flex flex-col items-center justify-center py-20 lg:py-32 space-y-6">
                <div class="w-20 h-20 bg-rose-50 text-rose-500 rounded-[2.5rem] flex items-center justify-center shadow-inner">
                    <svg class="w-10 h-10" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 15v2m0 0v2m0-2h2m-2 0H10m11-3V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2h14a2 2 0 002-2v-3z"></path></svg>
                </div>
                <div class="text-center">
                    <h3 class="text-lg font-bold text-[#3A3630] mb-2">Сессия Google истекла</h3>
                    <p class="text-sm text-warm-400 max-w-xs mx-auto leading-relaxed">Для продолжения работы необходимо повторно авторизовать приложение в Google Cloud Console.</p>
                </div>
                <button onclick="startDriveAuth()" class="px-10 py-4 bg-brand-500 text-white rounded-2xl font-black text-xs uppercase tracking-widest hover:bg-brand-600 transition-all shadow-xl shadow-brand-500/20 active:scale-95">
                    Авторизоваться
                </button>
            </div>
        `;
    }

    function renderBreadcrumbs() {
        const bc = document.getElementById('drive-breadcrumbs');
        bc.innerHTML = breadcrumbs.map((b, i) => `
            <div class="flex items-center gap-2">
                <span class="cursor-pointer hover:text-brand-700 transition-colors whitespace-nowrap ${i === breadcrumbs.length - 1 ? 'text-[#3A3630]' : ''}" 
                      onclick="loadDriveFolder('${b.id}', '${b.name}', true)">${b.name}</span>
                ${i < breadcrumbs.length - 1 ? '<svg class="w-2.5 h-2.5 opacity-30 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M9 5l7 7-7 7"></path></svg>' : ''}
            </div>
        `).join('');
    }

    async function startDriveAuth() {
        try {
            const res = await fetch('/api/drive/auth/init');
            const data = await res.json();
            const width = 600, height = 700;
            const left = (window.innerWidth - width) / 2;
            const top = (window.innerHeight - height) / 2;
            const authWindow = window.open(data.auth_url, 'google-auth', `width=${width},height=${height},left=${left},top=${top}`);
            
            const checkInterval = setInterval(() => {
                if (authWindow && authWindow.closed) {
                    clearInterval(checkInterval);
                    loadDriveFolder('root', 'Мой диск');
                }
            }, 1000);
        } catch (e) { alert('Ошибка вызова окна авторизации'); }
    }

    async function queueIngest(fileId, name) {
        const diarize = document.getElementById('global-diarize').checked;
        const formData = new FormData();
        formData.append('file_id', fileId);
        formData.append('diarize', diarize);
        
        try {
            const res = await fetch('/api/tasks/ingest', { method: 'POST', body: formData });
            if (res.ok) {
                // Flash notification
                const toast = document.createElement('div');
                toast.className = "fixed bottom-10 left-1/2 -translate-x-1/2 z-[100] px-6 py-3 bg-slate-900 text-white rounded-2xl text-xs font-bold uppercase tracking-widest shadow-2xl animate-in slide-in-from-bottom-4 duration-300";
                toast.textContent = `«${name}» добавлено в очередь`;
                document.body.appendChild(toast);
                setTimeout(() => {
                    toast.classList.add('animate-out', 'fade-out', 'slide-out-to-bottom-4');
                    setTimeout(() => toast.remove(), 300);
                }, 3000);
            }
        } catch (e) { alert('Ошибка при добавлении в очередь'); }
    }

    function submitIngestManual() {
        const id = document.getElementById('manual-file-id').value.trim();
        if (id) {
            queueIngest(id, 'Объект ' + id.substring(0, 8) + '...');
            document.getElementById('manual-file-id').value = '';
        }
    }

    loadDriveFolder('root', 'Мой диск');
</script>
{% endblock %}
