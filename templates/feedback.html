{% extends "base.html" %}

{% block title %}Обратная связь - Pulsar AI{% endblock %}

{% block content %}
<div class="flex-1 overflow-y-auto p-6 lg:p-10 custom-scrollbar">
    <div class="max-w-3xl mx-auto">
        <!-- Header -->
        <div class="mb-10">
            <h1 class="text-3xl font-black text-[#3A3630] tracking-tight mb-2">Обратная связь</h1>
            <p class="text-warm-500 font-medium">Есть идеи или нашли ошибку? Напишите нам, и мы создадим задачу в GitHub.</p>
        </div>

        <!-- Feedback Form -->
        <div class="bg-white border border-[#E5E1D8] rounded-[2rem] p-8 shadow-sm">
            <form id="feedback-form" class="space-y-6">
                <!-- Title -->
                <div>
                    <label for="title" class="block text-[10px] font-black text-warm-400 uppercase tracking-widest mb-2 ml-1">Заголовок</label>
                    <input type="text" id="title" name="title" required placeholder="Краткая суть сообщения..." 
                        class="w-full bg-[#FAF9F6] border border-[#E5E1D8] rounded-2xl px-5 py-4 text-sm font-bold text-[#3A3630] focus:outline-none focus:border-brand-400 focus:ring-4 focus:ring-brand-50/50 transition-all placeholder:text-warm-300">
                </div>

                <!-- Description -->
                <div>
                    <label for="description" class="block text-[10px] font-black text-warm-400 uppercase tracking-widest mb-2 ml-1">Описание</label>
                    <textarea id="description" name="description" required rows="6" placeholder="Опишите подробности..." 
                        class="w-full bg-[#FAF9F6] border border-[#E5E1D8] rounded-2xl px-5 py-4 text-sm font-bold text-[#3A3630] focus:outline-none focus:border-brand-400 focus:ring-4 focus:ring-brand-50/50 transition-all placeholder:text-warm-300 resize-none"></textarea>
                </div>

                <!-- Submit Button -->
                <div class="pt-2">
                    <button type="submit" id="submit-btn" class="w-full bg-[#3A3630] hover:bg-[#1A1814] text-[#FAF9F6] font-black uppercase tracking-widest py-5 rounded-2xl shadow-lg hover:shadow-xl transition-all flex items-center justify-center gap-3 group">
                        <span>Отправить</span>
                        <svg class="w-5 h-5 transition-transform group-hover:translate-x-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
    const form = document.getElementById('feedback-form');
    const submitBtn = document.getElementById('submit-btn');

    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const formData = new FormData(form);
        const data = {
            title: formData.get('title'),
            description: formData.get('description')
        };

        // Disable button
        submitBtn.disabled = true;
        const originalBtnText = submitBtn.innerHTML;
        submitBtn.innerHTML = `
            <svg class="animate-spin h-5 w-5 text-[#FAF9F6]" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
            <span>Отправка...</span>
        `;

        try {
            const response = await fetch('/api/v1/feedback', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });

            const result = await response.json();

            if (response.ok) {
                showToast('Сообщение успешно отправлено!', 'success');
                form.reset();
            } else {
                showToast(`Ошибка: ${result.detail || 'Неизвестная ошибка'}`, 'error');
            }
        } catch (error) {
            showToast(`Ошибка сети: ${error.message}`, 'error');
        } finally {
            submitBtn.disabled = false;
            submitBtn.innerHTML = originalBtnText;
        }
    });

    function showToast(message, type = 'success') {
        const toast = document.createElement('div');
        const bgColor = type === 'success' ? 'bg-[#3A3630]' : 'bg-rose-600';
        toast.className = `fixed bottom-8 left-8 z-[100] px-6 py-3 ${bgColor} text-[#FAF9F6] rounded-2xl text-[10px] font-black uppercase tracking-widest shadow-2xl animate-in slide-in-from-bottom-4 duration-300`;
        toast.textContent = message;
        document.body.appendChild(toast);
        setTimeout(() => {
            toast.classList.add('animate-out', 'fade-out', 'slide-out-to-bottom-4');
            setTimeout(() => toast.remove(), 300);
        }, 3000);
    }
</script>
{% endblock %}
