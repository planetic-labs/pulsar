services:
  qdrant:
    image: qdrant/qdrant:latest
    restart: always
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    networks:
      - planetic-net
    volumes:
      - qdrant_data:/qdrant/storage

  app:
    build:
      context: .
      args:
        - USER_ID=${UID:-1000}
        - GROUP_ID=${GID:-1000}
    user: "${UID:-1000}:${GID:-1000}"
    restart: always
    command: ["uv", "run", "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8032"]
    ports:
      - "127.0.0.1:8032:8032"
    networks:
      - planetic-net
    environment:
      - HF_HOME=/app/models_cache
    env_file: .env
    depends_on:
      qdrant:
        condition: service_started
    volumes:
      - .:/app
      - ./downloads:/app/downloads
      - ./data:/app/data
      - ./storage:/app/storage
      - ./models_cache:/app/models_cache

volumes:
  qdrant_data:

networks:
  planetic-net:
    external: true
