services:
  manticore:
    image: manticoresearch/manticore:latest
    restart: always
    ports:
      - "127.0.0.1:9308:9308"
      - "127.0.0.1:9306:9306"
    networks:
      - planetic-net
    volumes:
      - manticore_data:/var/lib/manticore

  pulsar:
    container_name: pulsar
    image: pulsar
    build:
      context: .
      args:
        - USER_ID=${UID:-1000}
        - GROUP_ID=${GID:-1000}
    user: "${UID:-1000}:${GID:-1000}"
    restart: always
    command: ["uv", "run", "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8033", "--proxy-headers", "--forwarded-allow-ips=*"]
    ports:
      - "127.0.0.1:8033:8033"
    networks:
      - planetic-net
    environment:
      - HF_HOME=/app/models_cache
      - APP_PORT=8033
    env_file: .env
    depends_on:
      manticore:
        condition: service_started
    volumes:
      - ./app:/app/app
      - ./logs:/app/logs
      - ./config:/app/config
      - ./data:/app/data
      - ./storage:/app/storage
      - ./models_cache:/app/models_cache
      - ./scripts:/app/scripts
      - ./templates:/app/templates
      - ./static:/app/static


volumes:
  manticore_data:

networks:
  planetic-net:
    external: true

