services:
  qdrant:
    image: qdrant/qdrant:latest
    restart: always
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    networks:
      - homelab-net
    volumes:
      - qdrant_data:/qdrant/storage

  app:
    build:
      context: .
      args:
        - USER_ID=${UID:-1000}
        - GROUP_ID=${GID:-1000}
    user: "${UID:-1000}:${GID:-1000}"
    restart: always
    command: ["uv", "run", "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "127.0.0.1:8000:8000"
    networks:
      - homelab-net
    environment:
      - HF_HOME=/srv/search-ui/models_cache
    env_file: .env
    depends_on:
      qdrant:
        condition: service_started
    volumes:
      - .:/srv/search-ui
      - ./downloads:/srv/search-ui/downloads
      - ./data:/srv/search-ui/data
      - ./storage:/srv/search-ui/storage
      - ./models_cache:/srv/search-ui/models_cache

volumes:
  qdrant_data:

networks:
  homelab-net:
    external: true
