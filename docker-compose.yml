name: pulsar-dev

services:
  manticore:
    image: manticoresearch/manticore:latest
    restart: always
    stop_grace_period: 30s
    ports:
      - "127.0.0.1:9308:9308"
      - "127.0.0.1:9306:9306"
    networks:
      - default
    volumes:
      - manticore_data:/var/lib/manticore
    healthcheck:
      # Pulsar starts only after both SQL protocols used by the application are ready.
      test:
        - CMD-SHELL
        - >-
          mysql -h 127.0.0.1 -P 9306 -e 'SELECT 1' &&
          wget --quiet --output-document=/dev/null --timeout=3
          --post-data='SELECT 1' 'http://127.0.0.1:9308/sql?mode=raw'
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 60s
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  pulsar:
    image: pulsar
    build:
      context: .
      args:
        - USER_ID=${UID:-1000}
        - GROUP_ID=${GID:-1000}
    user: "${UID:-1000}:${GID:-1000}"
    restart: always
    stop_grace_period: 30s
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8351", "--proxy-headers", "--forwarded-allow-ips=*"]
    ports:
      - "127.0.0.1:8351:8351"
    networks:
      - default
      - planetic-net
    environment:
      - APP_PORT=8351
    env_file: .env
    depends_on:
      manticore:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8351/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
    volumes:
      - ./app:/app/app
      - ./logs:/app/logs
      - ./config:/app/config
      - ./data:/app/data
      - ./storage:/app/storage
      - ./scripts:/app/scripts
      - ./templates:/app/templates
      - ./static:/app/static


volumes:
  manticore_data:
    name: pulsar-dev-manticore-data

networks:
  default:
  planetic-net:
    external: true
